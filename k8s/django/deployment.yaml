apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: todo-k8s-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: anower77/todo-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: todo-secret
            - configMapRef:
                name: todo-config
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
